name: Build and Release

on:
  push:
    branches:
      - master
    paths:
      - VERSION

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must use the X.Y.Z format, but contains: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Maven project version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          POM_VERSION="$(
            ./mvnw --batch-mode help:evaluate \
              -Dexpression=project.version \
              -DforceStdout \
              -q
          )"

          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "::error::pom.xml version '$POM_VERSION' does not match VERSION '$VERSION'."
            exit 1
          fi

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify executable JAR
        shell: bash
        run: |
          set -euo pipefail

          test -f target/release-notes.jar

          java -jar target/release-notes.jar --version \
            | grep -F "${{ steps.version.outputs.version }}"

      - name: Create SHA-256 checksum
        working-directory: target
        run: sha256sum release-notes.jar > release-notes.jar.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: |
            target/release-notes.jar
            target/release-notes.jar.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify SHA-256 checksum
        working-directory: dist
        run: sha256sum --check release-notes.jar.sha256

      - name: Check that release tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${{ needs.build.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag '$TAG' already exists."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"

          gh release create "$TAG" \
            dist/release-notes.jar \
            dist/release-notes.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release Notes Generator $VERSION" \
            --generate-notes